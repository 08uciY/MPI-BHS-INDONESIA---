<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MPI Cerpen Sejarah - Kelas XI</title><style>:root{font-family:system-ui,Arial;background:#f1f5f9;color:#172554}body{margin:0}header{background:#1e3a8a;color:white;padding:18px 5%}header h1{margin:4px 0;font-size:1.5rem}main{max-width:900px;margin:24px auto;padding:0 16px}.panel{background:white;border-radius:16px;padding:25px;box-shadow:0 5px 20px #14254a15}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}button{cursor:pointer;border:0;border-radius:9px;padding:11px 16px;background:#1d4ed8;color:white;font-weight:650}button.secondary{background:#dbeafe;color:#1e3a8a}button:disabled{opacity:.5;cursor:not-allowed}.active{background:#0f766e!important;color:white!important}.muted{color:#475569}.story{line-height:1.85;background:#f8fafc;border-left:4px solid #0f766e;padding:18px;border-radius:8px}.question{border:1px solid #cbd5e1;border-radius:10px;padding:15px;margin:14px 0}label{display:block;margin:9px 0;cursor:pointer}input[type=text],textarea{width:100%;box-sizing:border-box;border:1px solid #94a3b8;border-radius:8px;padding:12px;font:inherit}textarea{min-height:100px}.feedback{padding:12px;border-radius:8px;background:#ecfdf5;margin-top:12px}footer{text-align:center;color:#64748b;padding:25px}.progress{height:8px;background:#cbd5e1;border-radius:9px;margin-top:12px}.bar{height:100%;background:#34d399;border-radius:9px;transition:width .2s}h2{margin-top:0} @media print{nav,button{display:none!important}main{margin:0}.panel{box-shadow:none}}</style></head><body><header><small>PKBM MI ALMUJAHIDIN PUNDOHA • BAHASA INDONESIA • KELAS XI • FASE F</small><h1>Menggali Informasi Sejarah Bangsa melalui Cerpen</h1><div class="progress"><div class="bar" id="bar" style="width:0%"></div></div></header><main><nav id="nav"></nav><section class="panel" id="content" aria-live="polite"></section></main><footer>MPI interaktif • Berjalan tanpa internet • Materi cerita merupakan fiksi berlatar sejarah</footer><script>
const sections=['Beranda','Tujuan','Materi','Baca Cerpen','Analisis','Kuis','Refleksi','Hasil'];let current=0,answers={},checked=false;const story=`<h3>Sepucuk Surat di Bulan Agustus</h3><p><em>Cerpen orisinal untuk pembelajaran; tokoh dan percakapan bersifat rekaan.</em></p><p>Pagi itu, 16 Agustus 1945, Sari membantu ibunya menata kertas di sebuah rumah sederhana di Jakarta. Jalanan terasa berbeda. Orang-orang berbicara pelan, seolah kabar penting sedang bergerak dari satu pintu ke pintu lain.</p><p>“Mengapa semua orang menunggu, Bu?” tanya Sari. Ibunya menjawab, “Bangsa ini sedang menentukan langkahnya. Dengarkan dengan saksama, tetapi jangan mudah menyebarkan kabar yang belum pasti.”</p><p>Keesokan harinya, Sari mendengar berita bahwa Proklamasi Kemerdekaan Indonesia dibacakan oleh Soekarno, didampingi Mohammad Hatta, di Jakarta pada 17 Agustus 1945. Ia menuliskan tanggal itu di buku kecilnya. Di bawahnya ia menulis: <em>Kemerdekaan bukan hanya berita yang didengar, tetapi tanggung jawab yang dijaga.</em></p><p>Bertahun-tahun kemudian, buku kecil itu masih disimpan keluarganya. Sari tahu bahwa kisah pribadinya hanyalah satu cara untuk mengingat peristiwa besar bangsanya.</p>`;const qs=[['Kapan Proklamasi Kemerdekaan Indonesia dibacakan?',['16 Agustus 1945','17 Agustus 1945','18 Agustus 1945','20 Mei 1908'],1,'Tanggal sejarah yang benar adalah 17 Agustus 1945.'],['Siapa yang membacakan teks proklamasi?',['Mohammad Hatta','Sari','Soekarno','Ibu Sari'],2,'Soekarno membacakan proklamasi, didampingi Mohammad Hatta.'],['Tokoh Sari dalam cerpen merupakan ...',['tokoh fiktif','tokoh sejarah yang terverifikasi','penulis teks proklamasi','narator sejarah resmi'],0,'Sari adalah tokoh rekaan yang membantu pembaca memahami suasana cerita.'],['Latar waktu utama cerita adalah ...',['masa kerajaan','Agustus 1945','masa reformasi','tahun 2000'],1,'Petunjuk waktunya muncul secara eksplisit di dalam cerpen.'],['Pesan yang paling tepat dari cerpen adalah ...',['sebarkan semua kabar secepatnya','sejarah tidak perlu diperiksa','kemerdekaan perlu diingat dan dijaga dengan tanggung jawab','semua tokoh cerita pasti nyata'],2,'Cerpen menekankan sikap kritis dan tanggung jawab.']];function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(n){current=n;render();window.scrollTo(0,0)}function render(){document.getElementById('bar').style.width=(current/(sections.length-1)*100)+'%';document.getElementById('nav').innerHTML=sections.map((s,i)=>`<button class="secondary ${i===current?'active':''}" onclick="go(${i})">${i+1}. ${s}</button>`).join('');let c='';if(current===0)c=`<h2>Selamat datang!</h2><p>Jelajahi hubungan antara fakta sejarah, unsur pembangun cerpen, dan nilai kehidupan melalui cerita pendek interaktif.</p><p class="muted">Petunjuk: pilih menu berurutan, baca cerita, isi analisis, kerjakan lima soal, lalu lihat hasil. Jawaban tersimpan selama halaman ini terbuka.</p><button onclick="go(1)">Mulai belajar →</button>`;if(current===1)c=`<h2>Tujuan Pembelajaran</h2><ol><li>Mengidentifikasi fakta sejarah dan unsur fiksi dalam cerpen.</li><li>Menentukan tokoh, latar, alur, dan amanat cerita.</li><li>Menganalisis informasi sejarah berdasarkan petunjuk teks.</li><li>Mengomunikasikan refleksi secara tertulis.</li></ol><p><b>Pertanyaan pemantik:</b> Apakah setiap peristiwa dalam cerpen berlatar sejarah pasti merupakan fakta?</p><button onclick="go(2)">Pelajari materi →</button>`;if(current===2)c=`<h2>Materi Inti</h2><h3>Apa itu cerpen sejarah?</h3><p>Cerpen adalah karya prosa fiksi yang berfokus pada rangkaian peristiwa relatif singkat. Cerpen berlatar sejarah memanfaatkan masa atau peristiwa sejarah sebagai konteks cerita; tokoh, dialog, dan kejadian tertentu dapat direka.</p><h3>Unsur intrinsik</h3><p><b>Tema</b> (gagasan utama), <b>tokoh dan penokohan</b>, <b>latar</b> (tempat, waktu, suasana), <b>alur</b> (urutan peristiwa), <b>sudut pandang</b>, dan <b>amanat</b>.</p><h3>Membedakan fakta dan fiksi</h3><p>Periksa nama, tanggal, tempat, dan peristiwa menggunakan sumber sejarah tepercaya. Jangan menganggap dialog tokoh rekaan sebagai dokumen sejarah.</p><h3>Pengayaan: dari cerpen ke drama</h3><p>Adegan cerita dapat diadaptasi menjadi naskah drama melalui dialog, petunjuk laku, dan pembagian tokoh tanpa mengubah fakta sejarah yang sudah terverifikasi.</p><button onclick="go(3)">Baca cerpen →</button>`;if(current===3)c=`<h2>Mari Membaca</h2><article class="story">${story}</article><p><b>Tantangan membaca:</b> temukan satu informasi sejarah dan satu bagian yang merupakan unsur rekaan.</p><button onclick="go(4)">Analisis cerita →</button>`;if(current===4)c=`<h2>Lembar Analisis</h2><p>Isi berdasarkan cerpen yang telah dibaca.</p>${[['fact','Tuliskan satu fakta sejarah dalam cerita.'],['fiction','Tuliskan satu unsur fiksi dalam cerita.'],['setting','Jelaskan latar waktu dan tempat.'],['message','Apa amanat cerita?'],['drama','Ubah satu momen cerita menjadi dua baris dialog drama.']].map(([id,t])=>`<label for="${id}"><b>${t}</b></label><textarea id="${id}" oninput="answers['${id}']=this.value">${esc(answers[id])}</textarea>`).join('')}<p class="muted">Diskusikan hasil analisis bersama guru atau teman. Jawaban uraian tidak dinilai otomatis.</p><button onclick="go(5)">Lanjut ke kuis →</button>`;if(current===5)c=`<h2>Kuis Pemahaman</h2><p>Pilih satu jawaban pada setiap soal, lalu klik Periksa Jawaban.</p>${qs.map((q,i)=>`<div class="question"><b>${i+1}. ${q[0]}</b>${q[1].map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}" ${answers['q'+i]==j?'checked':''} onchange="answers.q${i}=${j};checked=false"> ${a}</label>`).join('')}${checked?`<div class="feedback">${answers['q'+i]===q[2]?'✓ Benar.':'Belum tepat.'} ${q[3]}</div>`:''}</div>`).join('')}<button onclick="check()">Periksa jawaban</button> <button class="secondary" onclick="go(6)">Lanjut refleksi →</button>`;if(current===6)c=`<h2>Refleksi Belajar</h2><label for="reflection">Apa hal baru yang kamu pahami tentang hubungan sejarah dan cerpen?</label><textarea id="reflection" oninput="answers.reflection=this.value">${esc(answers.reflection)}</textarea><label for="action">Bagaimana kamu akan memeriksa kebenaran informasi sejarah?</label><textarea id="action" oninput="answers.action=this.value">${esc(answers.action)}</textarea><button onclick="go(7)">Lihat hasil →</button>`;if(current===7){let done=qs.filter((q,i)=>answers['q'+i]!==undefined).length,score=qs.reduce((s,q,i)=>s+(answers['q'+i]===q[2]?20:0),0);c=`<h2>Hasil Pembelajaran</h2><p>Soal terjawab: <b>${done}/5</b></p><p>Nilai kuis: <strong style="font-size:2rem">${score}/100</strong></p><p>${done<5?'Lengkapi semua soal agar hasil mencerminkan pemahamanmu.':score>=80?'Bagus! Kamu telah memahami sebagian besar materi.':'Pelajari kembali materi dan penjelasan soal, lalu coba lagi.'}</p><p>Analisis tertulis: ${['fact','fiction','setting','message','drama'].filter(k=>(answers[k]||'').trim()).length}/5 bagian diisi.</p><p>Refleksi: ${answers.reflection?'Sudah diisi':'Belum diisi'}.</p><button onclick="window.print()">Cetak hasil</button> <button class="secondary" onclick="go(5)">Ulangi kuis</button> <button class="secondary" onclick="reset()">Mulai ulang seluruh MPI</button><p class="muted">Penilaian uraian dan refleksi dilakukan oleh guru. Nilai kuis dihitung otomatis, masing-masing soal 20 poin.</p>`}document.getElementById('content').innerHTML=c}function check(){if(qs.some((q,i)=>answers['q'+i]===undefined)){alert('Jawab kelima soal terlebih dahulu.');return}checked=true;render()}function reset(){if(confirm('Hapus seluruh jawaban dan mulai ulang?')){answers={};checked=false;go(0)}}render();</script></body></html>
